spring.application.name=warehouse

# PostgreSQL configuration for the main application profile.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/warehouse}
spring.datasource.username=${DB_USERNAME:warehouse}
spring.datasource.password=${DB_PASSWORD:warehouse}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.h2.console.enabled=false
